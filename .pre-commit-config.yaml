# Every hook runs inside a dev container, never on the host, so a commit is checked against the
# exact ruff and pyright that `backend/uv.lock` pins and the oxlint `frontend/pnpm-lock.yaml`
# pins (spec §2). `-T` disables TTY allocation, which pre-commit needs. `docker compose up -d`
# must be running for a commit.
#
# pre-commit passes paths relative to the repo root while each container's working directory is
# its own package, so the hooks check the whole package rather than the staged files.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (container)
        entry: docker compose exec -T app uv run ruff check --fix .
        language: system
        files: ^backend/
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: ruff-format
        name: ruff-format (container)
        entry: docker compose exec -T app uv run ruff format .
        language: system
        files: ^backend/
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: pyright
        name: pyright (container)
        entry: docker compose exec -T app uv run pyright
        language: system
        files: ^backend/
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: oxlint
        name: oxlint (container)
        entry: docker compose exec -T frontend pnpm lint
        language: system
        files: ^frontend/
        types_or: [ts, tsx, javascript, jsx]
        pass_filenames: false
        require_serial: true
