# Local development only; kumadrome runs deploy/docker-compose.yml (spec §12). Every tool runs
# inside a container, never on the host: `docker compose exec -T app uv run <tool>` for the
# backend, `docker compose exec -T frontend pnpm <script>` for the frontend.
name: closinglineup

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: closinglineup
      POSTGRES_PASSWORD: closinglineup
      POSTGRES_DB: closinglineup
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closinglineup -d closinglineup"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    # The uv base image, not the project Dockerfile, whose runtime stage carries no dev tools; uv
    # matches the `uv_build` pin. Not the slim variant: pyright's bundled node needs libatomic,
    # which slim leaves out.
    image: ghcr.io/astral-sh/uv:0.13-python3.13-trixie
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://closinglineup:closinglineup@postgres:5432/closinglineup
      DATA_DIR: /data
      # The cache and the venv sit on different volumes, so uv cannot hardlink between them.
      UV_LINK_MODE: copy
      # Keeps the container's bytecode out of the bind-mounted `__pycache__` the host uses.
      PYTHONPYCACHEPREFIX: /tmp/pycache
    volumes:
      # The source is bind-mounted and installed editable, so every `exec` runs the code on
      # disk with no rebuild, and the API server reloads on every source change.
      - ./backend:/app
      # Shadows the host's macOS `.venv` with the container's Linux one.
      - app-venv:/app/.venv
      # uv's package cache and pyright's node download, kept across container recreation.
      - cache:/root/.cache
      - ./data:/data
    command: ["sh", "-c", "uv sync --frozen && exec uv run closinglineup api --reload"]
    init: true
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22
    working_dir: /app
    environment:
      # `/api` goes to the backend service's API server.
      API_PROXY_TARGET: http://app:8000
      # corepack fetches the pnpm that `packageManager` pins without asking first.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # pnpm's store on the cache volume; it copies rather than hardlinks into node_modules.
      npm_config_store_dir: /root/.cache/pnpm-store
    volumes:
      - ./frontend:/app
      # The API's OpenAPI snapshot, where `pnpm gen:types` reads it (`../backend/...` from /app).
      - ./backend/tests/fixtures/api:/backend/tests/fixtures/api:ro
      # Shadows any host `node_modules` with the container's Linux one.
      - frontend-node-modules:/app/node_modules
      # corepack's pnpm download and the pnpm store, kept across container recreation.
      - frontend-cache:/root/.cache
    ports:
      - "5173:5173"
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && exec pnpm dev"]
    init: true

volumes:
  postgres-data:
  app-venv:
  cache:
  frontend-node-modules:
  frontend-cache:
