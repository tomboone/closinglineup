# closinglineup on kumadrome, the home server (spec §12). Deploy and operate per README.md; local
# development uses the root docker-compose.yml instead.
name: closinglineup

x-app: &app
  # `latest` tracks main; pin `sha-<7>` to roll back (README).
  image: ghcr.io/tomboone/closinglineup:latest
  env_file: .env
  environment:
    # Built here rather than in .env, so the password is set in one place.
    DATABASE_URL: postgresql+psycopg://closinglineup:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/closinglineup
    DATA_DIR: /data
  volumes:
    # create_host_path: false makes the start fail if the USB drive is not mounted, instead of
    # Docker creating an empty, root-owned directory on the root disk.
    - type: bind
      source: ${DATA_HOST_DIR:?set DATA_HOST_DIR in .env}
      target: /data
      bind:
        create_host_path: false
  restart: unless-stopped
  init: true
  labels:
    - com.centurylinklabs.watchtower.enable=true
    - com.centurylinklabs.watchtower.scope=closinglineup

services:
  postgres:
    # Not watched by Watchtower: a major upgrade needs a dump and restore, never a pull.
    image: postgres:17
    environment:
      POSTGRES_USER: closinglineup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: closinglineup
    volumes:
      - type: bind
        source: ${PG_HOST_DIR:?set PG_HOST_DIR in .env}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closinglineup -d closinglineup"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    <<: *app
    # Migrates before serving, so a Watchtower update that brings a migration applies it; only
    # `app` migrates, so two containers never race on the same upgrade.
    command: ["sh", "-c", "alembic upgrade head && exec closinglineup api"]
    # Readiness, not the image's freshness rule: a request to the API, which serves only once the
    # migrations above have run, so healthy here means the schema is at head. The worker waits on
    # it, and the worker is what derives, so a check that failed on stale data would keep a stack
    # brought up stale from ever catching up. The worker keeps the image's `closinglineup health`.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/meta', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 60s
      start_interval: 2s
    ports:
      # Loopback only: nothing on the LAN reaches it. `tailscale` below serves it on the personal
      # tailnet; this port is for an SSH tunnel and checks on the host.
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ["closinglineup", "worker"]
    depends_on:
      # `app` is healthy only once it has migrated and is serving, so the worker never writes
      # `job_run` rows into a schema that is not there yet. Watchtower restarts `app` before the worker
      # too, but does not wait for `app` to be healthy first, so the worker also waits for the schema
      # to reach its image's alembic head before it starts (`db.schema`).
      app:
        condition: service_healthy

  # closinglineup's own Tailscale node on the personal tailnet (ADR-0001), serving `app` over HTTPS at
  # https://closinglineup.<tailnet>.ts.net (tailscale/serve.json). The node is tagged tag:app. Each
  # app on kumadrome brings its own sidecar so that it gets its own MagicDNS name and HTTPS on 443.
  tailscale:
    image: tailscale/tailscale:stable
    # Never the name of a service it proxies: Docker maps a container's own hostname to itself in
    # /etc/hosts, so a proxy to that name would dial the sidecar (Navidrome's 502). The tailnet name
    # is TS_HOSTNAME.
    hostname: closinglineup-tailscale
    environment:
      TS_HOSTNAME: closinglineup
      # One-time auth key from the personal tailnet. Needed only for the first start; blank it once the
      # state directory holds the node key.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # Log in only when the state holds no node key. The default re-runs the login on every start,
      # which fails once a one-time key has been used.
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_STATE_DIR: /var/lib/tailscale
      # Userspace networking: serve accepts the tailnet connections itself, so the sidecar needs no tun
      # device and no NET_ADMIN.
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      # The directory, not the file: containerboot watches it, so a git pull that replaces serve.json
      # still reaches the sidecar.
      - ./tailscale:/config:ro
      # Node key and identity, on the USB drive so a recreated container rejoins as the same node.
      - type: bind
        source: ${TS_STATE_HOST_DIR:?set TS_STATE_HOST_DIR in .env}
        target: /var/lib/tailscale
        bind:
          create_host_path: false
    restart: unless-stopped

  # Polls GHCR every 5 minutes and restarts only enabled containers in the `closinglineup` scope, so
  # it leaves the other stacks' containers (and their own Watchtowers) on the same host alone. The
  # instance carries its own scope label, as Watchtower's multiple-instance docs require.
  watchtower:
    image: nickfedor/watchtower:1.23.2
    command: ["--label-enable", "--scope", "closinglineup", "--interval", "300", "--cleanup"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 60s
      timeout: 10s
    labels:
      - com.centurylinklabs.watchtower.scope=closinglineup
