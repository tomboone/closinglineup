version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "America/New_York"
    target-branch: "updates/dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      python:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The npm ecosystem reads pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "America/New_York"
    target-branch: "updates/dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    # tools/openapi-types pins TypeScript 5 on purpose: openapi-typescript drives the JS compiler
    # API, which TypeScript 7 no longer ships (see pnpm-workspace.yaml). Dependabot cannot scope
    # an ignore to one workspace package, so this also holds back the app's next TypeScript
    # major; take that one by hand.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      frontend:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "America/New_York"
    target-branch: "updates/dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
