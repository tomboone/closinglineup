version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: build
      prefix-development: build
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The npm ecosystem reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /frontend
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: build
      prefix-development: build
    # tools/openapi-types pins TypeScript 5 on purpose: openapi-typescript drives the JS compiler
    # API, which TypeScript 7 no longer ships (see pnpm-workspace.yaml). Dependabot cannot scope
    # an ignore to one workspace package, so this also holds back the app's next TypeScript
    # major; take that one by hand.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: ci
    # The shared workflows float on @v1; bumping them is the workflows repo's job.
    ignore:
      - dependency-name: neuroticsasquat-ch/workflows
    groups:
      minor-and-patch:
        update-types: [minor, patch]
